# Test, then deploy to the production server on every push to main.
# The deploy step logs in over SSH and runs deploy/deploy.sh. See docs/deploy.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A second push waits for the running one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # The tests mock every HTTP call and use a fake session; no Postgres needed.
      - run: python -m pytest -q

  deploy:
    name: Deploy to bayt.andalsolutions.com
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: /opt/bayt/deploy/deploy.sh
