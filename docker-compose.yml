name: bayt

services:
  db:
    build: ./db
    image: bayt-db
    environment:
      POSTGRES_USER: bayt
      POSTGRES_PASSWORD: bayt
      POSTGRES_DB: bayt
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayt -d bayt"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bayt:bayt@db:5432/bayt
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
      # Optional: lets the zoning answer read free text and write a cited summary.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ZONING_MODEL: ${ZONING_MODEL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  # One-off loader for City of Toronto open data. Run via `./start.sh city-data`.
  importer:
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.3
    profiles: [tools]
    environment:
      PGHOST: db
      PGDATABASE: bayt
      PGUSER: bayt
      PGPASSWORD: bayt
    volumes:
      - ./importer:/importer:ro
      - ./data/city:/data
    command: ["python3", "/importer/import_city_data.py"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
