name: bayt

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bayt
      POSTGRES_PASSWORD: bayt
      POSTGRES_DB: bayt
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayt -d bayt"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bayt:bayt@db:5432/bayt
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  pgdata:
